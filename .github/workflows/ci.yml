name: Local engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -S -m unittest discover -s tests -v
      - run: python scripts/check_source.py
      - run: python -m pip install --no-deps .
      - run: python -c "from os_agent_memory.web_server import dashboard_html; assert '安全遗忘' in dashboard_html()"
      - run: python scripts/evaluate_v3.py
