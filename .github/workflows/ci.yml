name: Local engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_competition:
        description: Run the strict current-source Windows/V11 material gate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -S -m unittest discover -s tests -v
      - run: python scripts/check_source.py
      - run: python -m pip install --no-deps .
      - run: python -c "from os_agent_memory.web_server import dashboard_html; assert '安全遗忘' in dashboard_html()"
      - run: python scripts/evaluate_v3.py --require-quality
      - run: python -X utf8 -S scripts/evaluate_requests.py --size 10000 --require-frozen --output artifacts/runtime/ci-requests.json
      - run: python -X utf8 -S scripts/check_deliverables.py --output artifacts/runtime/ci-materials.json
      - run: python -X utf8 -S scripts/run_ablations.py --require-diagnostics --output artifacts/runtime/ci-ablations.json
      - run: python -X utf8 -S scripts/benchmark_service.py --sizes 100,1000 --rounds 30 --require-integrity --output artifacts/runtime/ci-service.json
      - run: python -S scripts/evaluate_official.py --output artifacts/runtime/ci-official.json
      - run: python -S scripts/evaluate_actions.py --workspace artifacts/runtime/ci-actions --output artifacts/runtime/ci-actions.json
      - name: Preserve engineering evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/runtime/ci-*.json
          if-no-files-found: warn
          retention-days: 14

  competition_readiness:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_competition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Require current-source Windows and V11 evidence
        run: python -X utf8 -S scripts/generate_takeover_materials.py --check-only --report artifacts/runtime/ci-current-materials.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: competition-material-evidence
          path: artifacts/runtime/ci-current-materials.json
          if-no-files-found: warn
          retention-days: 14
